<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}MiniMinds Academy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    :root{--ink:#35245c;--purple:#7952dd;--yellow:#ffd45d;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Fredoka,ui-rounded,"Arial Rounded MT Bold",sans-serif;color:var(--ink);background:#bcecf4;overflow-x:hidden}body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(1px)}body:before{width:34vw;height:34vw;top:14%;left:-15vw;background:#ffe48c}body:after{width:42vw;height:42vw;right:-18vw;bottom:-22vw;background:#d9b7ff}.shell{max-width:1120px;margin:auto;padding:18px 24px 56px}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px;padding:10px 16px;background:#fffdf7d9;border:3px solid #fff;border-radius:22px;box-shadow:0 6px 0 #8ac7d5}.brand{font-size:1.55rem;font-weight:700;color:var(--ink);text-decoration:none}.brand span{display:inline-block;transform:rotate(-7deg)}.nav-links{display:flex;gap:6px;flex-wrap:wrap}.nav a:not(.brand){color:var(--ink);padding:7px 11px;border-radius:12px;text-decoration:none;font-weight:600}.nav a:not(.brand):hover{background:#eee1ff}.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#8a60e4,#a65add);border:4px solid #fff;border-radius:34px;padding:62px 9%;color:white;box-shadow:0 10px 0 #6344ae}.hero:after{content:"✦  ✧  ★";position:absolute;right:6%;top:14%;font-size:2rem;letter-spacing:.45rem;color:#ffe26d;transform:rotate(11deg);z-index:-1}.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.11em}.hero h1{font-size:clamp(2.3rem,6vw,4.5rem);line-height:.98;margin:8px 0 14px;max-width:680px;text-wrap:balance}.hero p{font-size:1.12rem;max-width:600px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.section-heading{margin:42px 0 18px;font-size:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:22px}.card,.panel{background:var(--paper);border:3px solid white;border-radius:25px;padding:24px;box-shadow:0 8px 0 #7ebdcc,0 13px 24px #5342781c}.card{transition:transform .18s ease}.card:hover{transform:translateY(-6px) rotate(-1deg)}.card:nth-child(2){background:#fff4ca}.card:nth-child(3){background:#ffe4ee}.course-icon{display:grid;place-items:center;width:62px;height:62px;border-radius:20px;background:#dbf7e9;font-size:2.1rem;transform:rotate(-5deg);margin-bottom:12px}.card:nth-child(2) .course-icon{background:#ffd775}.card:nth-child(3) .course-icon{background:#d9c5ff}.button,button{background:var(--yellow);color:var(--ink);border:2px solid #d79f2d;border-bottom-width:5px;border-radius:17px;padding:11px 18px;font:inherit;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer;transition:transform .15s,filter .15s}.button:hover,button:hover{transform:translateY(-2px);filter:brightness(1.04)}.button:active,button:active{transform:translateY(2px);border-bottom-width:2px}.button.alt{background:white;border-color:white;color:#6540b7}.input{width:100%;padding:12px 14px;border:2px solid #d6c7e8;border-radius:14px;margin:6px 0 16px;font:inherit;color:var(--ink);background:white}.input:focus{outline:3px solid #ffd45d;border-color:#9265dc}.notice{padding:12px 16px;border:3px solid white;border-radius:16px;margin:10px 0;background:#dbf7e9;color:#17663a;font-weight:600;box-shadow:0 4px 0 #7ebdcc}.notice.error{background:#ffe0e7;color:#9a2637}.muted{color:#675f7a}.stat{font-size:1.8rem;font-weight:700;color:#7650d0}.lesson{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:2px dashed #e5dcec;padding:16px 0}.lesson:first-of-type{margin-top:14px}.lesson button{padding:8px 13px;font-size:.9rem}.done{color:#278653;font-weight:bold;background:#d8f6e4;padding:7px 11px;border-radius:12px}.small{font-size:.9rem}.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.pill{background:#eee3ff;border-radius:999px;padding:2px 9px;font-size:.8rem;font-weight:600}.auth-panel{max-width:540px;margin:48px auto}.dashboard-title{margin:20px 0 2px;font-size:2.6rem}.kid-login{max-width:680px;margin:40px auto;text-align:center}.kid-login form{max-width:350px;margin:auto;text-align:left}.kid-login .input{color:var(--ink)}.sound-controls{display:flex;align-items:center;gap:7px;padding-left:8px;border-left:2px solid #e6daf7}.sound-toggle{display:flex;align-items:center;gap:5px;background:#eee3ff;border:2px solid #cdb9eb;border-bottom-width:3px;border-radius:13px;padding:6px 9px;font-size:.82rem;white-space:nowrap}.sound-toggle[aria-pressed="true"]{background:#d8f6e4;border-color:#82c9a0}.sound-volume{display:flex;align-items:center;gap:3px}.sound-volume input{width:58px;accent-color:#7952dd}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.sound-status{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;background:#35245c;color:white;border-radius:999px;padding:8px 14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}.sound-status.show{opacity:1}@media(max-width:720px){.shell{padding:14px 15px 42px}.nav{align-items:flex-start;flex-direction:column}.sound-controls{padding-left:0;border-left:0}.hero{padding:43px 24px;border-radius:27px}.hero:after{opacity:.5}.section-heading{font-size:1.7rem}.lesson{align-items:flex-start;flex-direction:column}.dashboard-title{font-size:2.15rem}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="nav">
      <a class="brand" data-sound="sparkle" href="{{ url_for('home') }}"><span>🧠</span> MiniMinds</a>
      <span class="nav-links"><a href="{{ url_for('kids_login') }}">Kid login</a>{% if session.parent_id %}<a href="{{ url_for('parent_dashboard') }}">Parent area</a><a href="{{ url_for('logout') }}">Log out</a>{% else %}<a href="{{ url_for('login') }}">Parent login</a>{% endif %}</span>
      <div class="sound-controls" aria-label="Sound controls"><button class="sound-toggle" type="button" data-sound-toggle aria-pressed="false" aria-label="Turn on happy sounds"><span aria-hidden="true">🔇</span><span class="sound-toggle-label">Sounds off</span></button><label class="sound-volume" for="sound-volume"><span class="sr-only">Sound volume</span><span aria-hidden="true">🔉</span><input id="sound-volume" data-sound-volume type="range" min="0" max="100" value="65" aria-label="Sound volume"></label></div>
    </nav>
    {% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <div class="sound-status" data-sound-status role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/sound-system.js') }}" defer></script>{% block scripts %}{% endblock %}
</body>
</html>
