<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}MiniMinds Academy{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><style>body{background:#f7f8ff}.shell{max-width:1080px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.brand{font-size:1.45rem;font-weight:700;color:#5138ad;text-decoration:none}.nav a{color:#5138ad;margin-left:16px;text-decoration:none;font-weight:600}.hero{background:linear-gradient(135deg,#5d48c7,#a252ca);border-radius:28px;padding:70px 9%;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:20px}.card,.panel{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #39306b14}.button,button{background:#5c45ca;color:white;border:0;border-radius:999px;padding:12px 21px;font:inherit;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer}.button.alt{background:white;color:#5c45ca}.input{width:100%;padding:12px;border:1px solid #d8d4e9;border-radius:10px;margin:6px 0 16px;font:inherit}.notice{padding:12px 16px;border-radius:12px;margin:10px 0;background:#e8fff0;color:#17663a}.notice.error{background:#fff0f2;color:#9a2637}.muted{color:#675f7a}.course-icon{font-size:2.4rem}.stat{font-size:1.8rem;font-weight:700;color:#5d48c7}.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.done{color:#248e54;font-weight:bold}.small{font-size:.9rem}@media(max-width:600px){.hero{padding:44px 24px}.nav{align-items:flex-start;gap:10px;flex-direction:column}.nav a{margin-left:0;margin-right:12px}}</style></head><body><main class="shell"><nav class="nav"><a class="brand" href="{{ url_for('home') }}">🎓 MiniMinds</a><span><a href="{{ url_for('kids_login') }}">Kid login</a>{% if session.parent_id %}<a href="{{ url_for('parent_dashboard') }}">Parent area</a><a href="{{ url_for('logout') }}">Log out</a>{% else %}<a href="{{ url_for('login') }}">Parent login</a>{% endif %}</span></nav>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
