{% extends 'base.html' %}{% block content %}<section class="hero kid-login"><p class="eyebrow">YOUR ADVENTURE AWAITS</p><h1>Ready to play?</h1><p>Choose your name and enter your secret four-digit PIN.</p><form method="post"><label>Who are you?</label><select class="input" name="child_id" required><option value="">Choose your name</option>{% for child in children %}<option value="{{ child.id }}">{{ child.name }} · age {{ child.age }}</option>{% endfor %}</select><label>Secret PIN</label><input class="input" type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required><button class="button alt" style="width:100%">Let's go! 🚀</button></form>{% if not children %}<p class="small">Ask a grown-up to create your profile in the Parent area first.</p>{% endif %}</section>{% endblock %}
